<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Crawler</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 24px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h1 span.icon { font-size: 1.6rem; }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: #8b949e;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.95rem;
      padding: 8px 12px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #388bfd; }

    .url-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .url-row .url-field { flex: 1; }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    button {
      padding: 9px 22px;
      border-radius: 6px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, background .15s;
      white-space: nowrap;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }

    #btnCrawl  { background: #238636; color: #fff; }
    #btnCrawl:hover:not(:disabled)  { background: #2ea043; }
    #btnStop   { background: #b62324; color: #fff; display: none; }
    #btnStop:hover:not(:disabled)   { background: #cf222e; }

    /* progress */
    .progress-wrap {
      background: #21262d;
      border-radius: 6px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 14px;
      display: none;
    }
    .progress-bar {
      height: 100%;
      background: #238636;
      width: 0%;
      transition: width .25s;
      border-radius: 6px;
    }

    /* stats */
    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-val {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }
    .stat-val.green { color: #3fb950; }
    .stat-val.red   { color: #f85149; }
    .stat-val.blue  { color: #58a6ff; }
    .stat-lbl {
      font-size: 0.72rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    /* status message */
    #statusMsg {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 14px;
      min-height: 1.2em;
    }
    #statusMsg.error { color: #f85149; }
    #statusMsg.done  { color: #3fb950; }

    /* results table */
    .table-wrap {
      overflow-x: auto;
      max-height: 480px;
      overflow-y: auto;
      border: 1px solid #21262d;
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    thead th {
      background: #161b22;
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      color: #8b949e;
      border-bottom: 1px solid #21262d;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: .04em;
    }
    tbody tr {
      border-bottom: 1px solid #161b22;
      transition: background .1s;
    }
    tbody tr:hover { background: #1c2128; }
    tbody td {
      padding: 8px 14px;
      vertical-align: middle;
      color: #c9d1d9;
    }
    td.url-cell {
      max-width: 420px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.78rem;
    }
    td.url-cell a {
      color: #58a6ff;
      text-decoration: none;
    }
    td.url-cell a:hover { text-decoration: underline; }
    td.num { color: #8b949e; text-align: right; width: 48px; }
    td.links-count { text-align: right; color: #8b949e; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: monospace;
    }
    .badge-ok  { background: #1b4721; color: #3fb950; }
    .badge-redir { background: #2d3d0e; color: #d2a679; }
    .badge-err { background: #3b1116; color: #f85149; }
    .badge-0   { background: #272b30; color: #8b949e; }

    td.error-cell {
      font-size: 0.72rem;
      color: #f85149;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #emptyMsg {
      text-align: center;
      padding: 40px;
      color: #484f58;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<h1><span class="icon">🕷️</span> Web Crawler</h1>

<!-- Controls -->
<div class="card">
  <div class="url-row">
    <div class="url-field">
      <label for="seedUrl">Seed URL</label>
      <input id="seedUrl" type="text" placeholder="https://docs.example.com" />
    </div>
    <button id="btnCrawl" onclick="startCrawl()">Crawl</button>
    <button id="btnStop"  onclick="stopCrawl()">Stop</button>
  </div>

  <div class="controls-grid">
    <div>
      <label for="depth">Depth</label>
      <input id="depth" type="number" value="2" min="1" max="10" />
    </div>
    <div>
      <label for="pages">Max Pages</label>
      <input id="pages" type="number" value="50" min="1" max="500" />
    </div>
    <div>
      <label for="delay">Delay (s)</label>
      <input id="delay" type="number" value="0.3" min="0" max="10" step="0.1" />
    </div>
    <div>
      <label for="include">Include pattern</label>
      <input id="include" type="text" placeholder="/docs/, /posts/" />
    </div>
    <div>
      <label for="exclude">Exclude pattern</label>
      <input id="exclude" type="text" placeholder="/tag/, /author/" />
    </div>
  </div>
</div>

<!-- Results -->
<div class="card">
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-val blue" id="statCrawled">0</span>
      <span class="stat-lbl">Crawled</span>
    </div>
    <div class="stat">
      <span class="stat-val green" id="statLinks">0</span>
      <span class="stat-lbl">Links found</span>
    </div>
    <div class="stat">
      <span class="stat-val red" id="statErrors">0</span>
      <span class="stat-lbl">Errors</span>
    </div>
  </div>

  <div id="statusMsg">Paste a URL above and click Crawl.</div>

  <div class="table-wrap">
    <table id="resultsTable">
      <thead>
        <tr>
          <th style="width:48px">#</th>
          <th>URL</th>
          <th style="width:70px;text-align:center">Status</th>
          <th style="width:80px;text-align:right">Links</th>
          <th>Error</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="5" id="emptyMsg">No results yet.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  let evtSource = null;
  let totalLinks = 0;
  let totalErrors = 0;

  function startCrawl() {
    const url = document.getElementById('seedUrl').value.trim();
    if (!url) { alert('Please enter a seed URL.'); return; }

    // Reset state
    stopCrawl();
    totalLinks = 0;
    totalErrors = 0;
    document.getElementById('tbody').innerHTML = '';
    document.getElementById('statCrawled').textContent = '0';
    document.getElementById('statLinks').textContent = '0';
    document.getElementById('statErrors').textContent = '0';
    setStatus('Starting crawl…');
    document.getElementById('progressWrap').style.display = 'block';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('btnCrawl').style.display = 'none';
    document.getElementById('btnStop').style.display = '';

    const params = new URLSearchParams({
      url,
      depth:   document.getElementById('depth').value,
      pages:   document.getElementById('pages').value,
      delay:   document.getElementById('delay').value,
      include: document.getElementById('include').value,
      exclude: document.getElementById('exclude').value,
    });

    evtSource = new EventSource(`/crawl?${params}`);

    evtSource.onmessage = function(e) {
      const d = JSON.parse(e.data);

      if (d.fatal) {
        setStatus('Fatal error: ' + d.error, 'error');
        cleanup();
        return;
      }

      if (d.done) {
        setStatus(`Done — ${d.total} page${d.total !== 1 ? 's' : ''} crawled.`, 'done');
        document.getElementById('progressBar').style.width = '100%';
        cleanup();
        return;
      }

      // Progress
      const pct = Math.round((d.count / d.max) * 100);
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('statCrawled').textContent = d.count;

      // Accumulate
      totalLinks += (d.links || 0);
      if (d.error) totalErrors++;
      document.getElementById('statLinks').textContent = totalLinks;
      document.getElementById('statErrors').textContent = totalErrors;

      setStatus(`Crawling… (${d.count}/${d.max})`);

      // Row
      const tbody = document.getElementById('tbody');
      const row = document.createElement('tr');

      const statusClass = d.status >= 200 && d.status < 300 ? 'badge-ok'
                        : d.status >= 300 && d.status < 400 ? 'badge-redir'
                        : d.status >= 400 ? 'badge-err' : 'badge-0';
      const statusText = d.status || 'ERR';

      row.innerHTML = `
        <td class="num">${d.count}</td>
        <td class="url-cell"><a href="${escHtml(d.url)}" target="_blank" title="${escHtml(d.url)}">${escHtml(d.url)}</a></td>
        <td style="text-align:center"><span class="badge ${statusClass}">${statusText}</span></td>
        <td class="links-count">${d.links || 0}</td>
        <td class="error-cell">${escHtml(d.error || '')}</td>
      `;
      tbody.appendChild(row);
      // Auto-scroll
      const wrap = tbody.closest('.table-wrap');
      wrap.scrollTop = wrap.scrollHeight;
    };

    evtSource.onerror = function() {
      setStatus('Connection lost.', 'error');
      cleanup();
    };
  }

  function stopCrawl() {
    if (evtSource) {
      evtSource.close();
      evtSource = null;
    }
    cleanup();
  }

  function cleanup() {
    document.getElementById('btnCrawl').style.display = '';
    document.getElementById('btnStop').style.display = 'none';
    if (evtSource) { evtSource.close(); evtSource = null; }
  }

  function setStatus(msg, cls) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = cls || '';
  }

  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Allow Enter key on URL field
  document.getElementById('seedUrl').addEventListener('keydown', e => {
    if (e.key === 'Enter') startCrawl();
  });
</script>

</body>
</html>
